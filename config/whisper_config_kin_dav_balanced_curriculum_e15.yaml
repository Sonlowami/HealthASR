# Same data/start as no-curriculum e15; easiest-first via WER ranking (--curriculum).
# Rescores with the current model at the start of every stage (not once-only).
# Start: kin-only 10-ep final. Data: ~27 h Kin balanced + ~27 h Dav expanded.
checkpoint: /project/community/rmwisene/pipeline_outputs/whisper_runs/kin-only-sunbird-e10/final
output_dir: /project/community/rmwisene/pipeline_outputs/whisper_runs/kin-dav-balanced-27h-curriculum-e15

languages:
  kinyarwanda:
    train_manifest: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda/manifests/train_processed_balanced_27h.tsv
    eval_manifest: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda/manifests/dev_processed.tsv
    audio_dir: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda
    lang_token_id: 50350   # 'kin'
    oversample: 1
  kidawida:
    train_manifest: /project/community/rmwisene/pipeline_outputs/processed/kidawida/manifests/train_processed.tsv
    eval_manifest: /project/community/rmwisene/pipeline_outputs/processed/kidawida/manifests/dev_processed.tsv
    audio_dir: /project/community/rmwisene/pipeline_outputs/processed/kidawida
    lang_token_id: 50318   # 'swa' proxy for Kidaw'ida
    oversample: 1

training:
  learning_rate: 1.0e-5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch = 32
  warmup_steps: 500
  num_train_epochs: 15             # ignored per-stage; stages use epochs_per_stage
  eval_steps: 2000
  save_steps: 2000
  logging_steps: 200
  dataloader_num_workers: 24
  report_to: wandb
  run_name: whisper-salt-kin-dav-balanced-27h-curriculum-e15
  early_stopping_patience: null

curriculum:
  schedule: [0.2, 0.5, 0.7, 1.0]   # fraction of easiest clips (by WER) per stage
  epochs_per_stage: [3, 3, 3, 6]  # 3+3+3+6 = 15
  # WER ranking runs at the start of each stage (4 passes over train)
  score_batch_size: 64
  score_num_workers: 16
  score_max_new_tokens: 128
