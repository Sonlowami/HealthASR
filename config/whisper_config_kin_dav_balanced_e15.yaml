# +5 epochs on top of kin-dav-balanced-27h 10-epoch final (total 15 epochs of bilingual FT).
# Do NOT --resume into the old e10 run: only checkpoint-2000 remains there (would rewind).
# This loads e10/final weights and trains 5 more epochs with a fresh optimizer.
checkpoint: /project/community/rmwisene/pipeline_outputs/whisper_runs/kin-dav-balanced-27h-e10/final
output_dir: /project/community/rmwisene/pipeline_outputs/whisper_runs/kin-dav-balanced-27h-e15

languages:
  kinyarwanda:
    train_manifest: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda/manifests/train_processed_balanced_27h.tsv
    eval_manifest: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda/manifests/dev_processed.tsv
    audio_dir: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda
    lang_token_id: 50350   # 'kin'
    oversample: 1
  kidawida:
    train_manifest: /project/community/rmwisene/pipeline_outputs/processed/kidawida/manifests/train_processed.tsv
    eval_manifest: /project/community/rmwisene/pipeline_outputs/processed/kidawida/manifests/dev_processed.tsv
    audio_dir: /project/community/rmwisene/pipeline_outputs/processed/kidawida
    lang_token_id: 50318   # 'swa' proxy for Kidaw'ida
    oversample: 1

training:
  learning_rate: 1.0e-5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch = 32
  warmup_steps: 100               # short: continuing from a trained model
  num_train_epochs: 5
  eval_steps: 2000
  save_steps: 2000
  logging_steps: 200
  dataloader_num_workers: 24
  report_to: wandb
  run_name: whisper-salt-kin-dav-balanced-27h-e15
  early_stopping_patience: null
