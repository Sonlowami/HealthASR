# Kin-only curriculum FT from Sunbird SALT (fair compare to kin-only e10 no-curriculum).
# WER rescoring at each stage. Full Kin train (~180k clips).
# Checkpoints on /project/community; save every epoch; keep last 2.
checkpoint: Sunbird/asr-whisper-large-v3-salt
output_dir: /project/community/rmwisene/pipeline_outputs/whisper_runs/kin-only-curriculum-e10

languages:
  kinyarwanda:
    train_manifest: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda/manifests/train_processed.tsv
    eval_manifest: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda/manifests/dev_processed.tsv
    audio_dir: /project/community/rmwisene/datasets/kinyarwanda/kinyarwanda
    lang_token_id: 50350   # 'kin'
    oversample: 1

training:
  learning_rate: 1.0e-5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch = 32
  warmup_steps: 500
  num_train_epochs: 10             # ignored per-stage; stages use epochs_per_stage
  eval_steps: 2000
  logging_steps: 200
  dataloader_num_workers: 24
  report_to: wandb
  run_name: whisper-salt-kin-only-curriculum-e10
  early_stopping_patience: null
  save_strategy: epoch
  save_total_limit: 2              # full ckpt (model+optimizer) for real --resume

curriculum:
  schedule: [0.2, 0.5, 0.7, 1.0]
  epochs_per_stage: [2, 2, 2, 4]   # 2+2+2+4 = 10
  score_batch_size: 64
  score_num_workers: 16
  score_max_new_tokens: 128
