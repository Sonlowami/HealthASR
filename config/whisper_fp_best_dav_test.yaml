# Full-precision Whisper on Kidaw'ida test (best bilingual curriculum e15).

languages:
  kidawida:
    train_manifest: /project/community/rmwisene/pipeline_outputs/processed/kidawida/manifests/train_processed.tsv
    eval_manifest: /project/community/rmwisene/pipeline_outputs/processed/kidawida/manifests/test_processed.tsv
    audio_dir: /project/community/rmwisene/pipeline_outputs/processed/kidawida
    lang_token_id: 50318
    oversample: 1

models:
  - key: kin-dav-balanced-27h-curriculum-e15
    path: /project/community/rmwisene/pipeline_outputs/whisper_runs/kin-dav-balanced-27h-curriculum-e15/final

export_bundles:
  - file: kidawida_test_fp_curriculum_e15_predictions.csv
    language: kidawida
    models:
      - kin-dav-balanced-27h-curriculum-e15

eval:
  score_batch_size: 32
  score_num_workers: 16
  score_max_new_tokens: 128
